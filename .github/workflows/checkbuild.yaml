name: checks

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test server
        run: go test ./...

      - name: Build server
        run: go build ./...

  javascript:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install SDK dependencies
        run: npm ci

      - name: Check SDKs
        run: npm run typecheck:sdk && npm run test:sdk && npm run build:sdk

      - name: Check npm package contents
        run: npm pack --dry-run --workspace @reverse-http/express && npm pack --dry-run --workspace @reverse-http/react

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Check UI
        run: npm run lint --prefix ui && npm run build --prefix ui

  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml

      - name: Install Python SDK
        run: python -m pip install -e './packages/python[dev,flask,fastapi]'

      - name: Test Python SDK
        run: pytest -q packages/python

      - name: Check Python package
        run: python -m build packages/python && twine check packages/python/dist/*
